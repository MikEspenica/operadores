<!DOCTYPE html>
<html>
<head>
<title>Operadores</title>
<link href="style.css" rel="stylesheet">
</head>
<body>

<h1>Operadores</h1>
<p id="soma"></p>
<p id="subtraçao"></p>
<p id="multiplicaçao"></p>
<p id="divisao"></p>

<script>
let x = 14;
let y = 13;
let soma = x + y;
let subtraçao = x - y;
let multiplicaçao = x * y;
let divisao = x / y;
    

document.getElementById("soma").innerHTML = soma;
document.getElementById("subtraçao").innerHTML = subtraçao;
document.getElementById("multiplicaçao").innerHTML = multiplicaçao;
document.getElementById("divisao").innerHTML = divisao;
</script>


</body>
</html>
